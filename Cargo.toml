[workspace]
members = ["crates/no-warden", "crates/no-warden-server", "crates/no-warden-conformance"]
default-members = ["crates/no-warden"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/no-std-rs/no-warden"

# Keep full-strength fixture derivation practical in the real-client suites.
[profile.conformance]
inherits = "dev"
debug-assertions = true
overflow-checks = true

[profile.conformance.package.no-warden-conformance]
opt-level = 2

[profile.conformance.package.sha2]
opt-level = 2
