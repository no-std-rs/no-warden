name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: rustup target add riscv32imac-unknown-none-elf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo check -p no-warden --lib --locked --target riscv32imac-unknown-none-elf
      - run: cargo fmt --manifest-path checks/no-alloc/Cargo.toml --check
      - run: cargo build --manifest-path checks/no-alloc/Cargo.toml --locked --target riscv32imac-unknown-none-elf
      - run: cargo fmt --manifest-path tools/api-inventory/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/api-inventory/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path tools/api-inventory/Cargo.toml --locked
      - name: Check the exhaustive pinned server route inventory
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://codeload.github.com/dani-garcia/vaultwarden/tar.gz/58a980f850464f7d9cdc99a765df36f0a3308b91 -o "$RUNNER_TEMP/vaultwarden.tar.gz"
          mkdir -p "$RUNNER_TEMP/vaultwarden-source"
          tar --extract --gzip --file "$RUNNER_TEMP/vaultwarden.tar.gz" --directory "$RUNNER_TEMP/vaultwarden-source" --strip-components=1
          cargo run --manifest-path tools/api-inventory/Cargo.toml --locked -- --source "$RUNNER_TEMP/vaultwarden-source" --check compatibility/vaultwarden-routes.json
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check -p no-warden --lib --locked
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check -p no-warden-server --locked
      - run: cargo +1.89.0 check -p no-warden-conformance --locked
  # Keep these four jobs explicit: the required context checks every result.
  bitwarden-cli-http:
    uses: ./.github/workflows/client-shard.yml
    with:
      shard: http
  bitwarden-cli-baseline:
    uses: ./.github/workflows/client-shard.yml
    with:
      shard: baseline
  bitwarden-cli-organization-a:
    uses: ./.github/workflows/client-shard.yml
    with:
      shard: organization-a
  bitwarden-cli-organization-b:
    uses: ./.github/workflows/client-shard.yml
    with:
      shard: organization-b
  bitwarden-cli:
    if: ${{ always() }}
    needs: [bitwarden-cli-http, bitwarden-cli-baseline, bitwarden-cli-organization-a, bitwarden-cli-organization-b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require every fixed client shard to succeed
        env:
          CLIENT_SHARD_RESULTS: ${{ toJSON(needs) }}
        run: node tools/client-ci.mjs aggregate
