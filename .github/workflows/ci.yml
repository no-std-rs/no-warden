name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: rustup target add riscv32imac-unknown-none-elf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo check -p no-warden --lib --locked --target riscv32imac-unknown-none-elf
      - run: cargo fmt --manifest-path checks/no-alloc/Cargo.toml --check
      - run: cargo build --manifest-path checks/no-alloc/Cargo.toml --locked --target riscv32imac-unknown-none-elf
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check -p no-warden --lib --locked
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check -p no-warden-server --locked
  bitwarden-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: npm ci --prefix tools
      - run: cargo build -p no-warden-server --locked
      - name: Real client and authorization checks
        shell: bash
        run: |
          set -euo pipefail
          NO_WARDEN_DB="$RUNNER_TEMP/no-warden.db" target/debug/no-warden-server > "$RUNNER_TEMP/no-warden.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/no-warden.log"' EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8000/health
          node --test tools/server-tests.mjs
          node tools/persistence.mjs
          bash tools/e2e.sh
