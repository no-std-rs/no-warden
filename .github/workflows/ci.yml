name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: rustup target add riscv32imac-unknown-none-elf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo check -p no-warden --lib --locked --target riscv32imac-unknown-none-elf
      - run: cargo fmt --manifest-path checks/no-alloc/Cargo.toml --check
      - run: cargo build --manifest-path checks/no-alloc/Cargo.toml --locked --target riscv32imac-unknown-none-elf
      - run: cargo fmt --manifest-path tools/api-inventory/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/api-inventory/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path tools/api-inventory/Cargo.toml --locked
      - name: Check the exhaustive pinned server route inventory
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://codeload.github.com/dani-garcia/vaultwarden/tar.gz/58a980f850464f7d9cdc99a765df36f0a3308b91 -o "$RUNNER_TEMP/vaultwarden.tar.gz"
          mkdir -p "$RUNNER_TEMP/vaultwarden-source"
          tar --extract --gzip --file "$RUNNER_TEMP/vaultwarden.tar.gz" --directory "$RUNNER_TEMP/vaultwarden-source" --strip-components=1
          cargo run --manifest-path tools/api-inventory/Cargo.toml --locked -- --source "$RUNNER_TEMP/vaultwarden-source" --check compatibility/vaultwarden-routes.json
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check -p no-warden --lib --locked
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check -p no-warden-server --locked
      - run: cargo +1.89.0 check -p no-warden-conformance --locked
  bitwarden-cli:
    runs-on: ubuntu-latest
    env:
      BW_CLIENTS_COMMIT: b449ac1d255784380d75ef026343198891286be7
      BW_SDK_COMMIT: c5e53d3e82ab80fdc9fd79ebd74058399a6444b6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: npm ci --prefix tools
      - run: curl --fail --location --retry 3 "https://raw.githubusercontent.com/bitwarden/clients/$BW_CLIENTS_COMMIT/package-lock.json" -o "$RUNNER_TEMP/clients-build-package-lock.json"
      - name: Fetch the pinned bundled SDK request sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://codeload.github.com/bitwarden/sdk-internal/tar.gz/$BW_SDK_COMMIT" -o "$RUNNER_TEMP/sdk.tar.gz"
          mkdir -p "$RUNNER_TEMP/sdk-source"
          tar --extract --gzip --file "$RUNNER_TEMP/sdk.tar.gz" --directory "$RUNNER_TEMP/sdk-source" --strip-components=1
      - run: prlimit --version
      - run: node --test tools/repository-policy.test.mjs
      - run: node --test tools/api-coverage.test.mjs
      - run: node --test tools/cli-inventory.test.mjs
        env:
          BW_CLIENTS_BUILD_LOCK: ${{ runner.temp }}/clients-build-package-lock.json
          BW_SDK_SOURCE_ROOT: ${{ runner.temp }}/sdk-source
      - run: cargo build -p no-warden-server -p no-warden-conformance --locked
      - name: Real client and authorization checks
        shell: bash
        run: |
          set -euo pipefail
          NO_WARDEN_DB="$RUNNER_TEMP/no-warden.db" target/debug/no-warden-server > "$RUNNER_TEMP/no-warden.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/no-warden.log"' EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8000/health
          node --test tools/server-tests.mjs
          node tools/persistence.mjs
          target/debug/no-warden-http-conformance
          target/debug/no-warden-http-conformance --suite webauthn-credentials
          target/debug/no-warden-http-conformance --suite personal-vault-purge
          target/debug/no-warden-http-conformance --suite account-deletion
          target/debug/no-warden-http-conformance --suite account-kdf-cli
          target/debug/no-warden-http-conformance --suite account-password-cli
          bash tools/e2e.sh
