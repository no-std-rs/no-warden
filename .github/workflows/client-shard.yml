name: Client shard
on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: string
    outputs:
      completed:
        description: Every assigned client check completed successfully
        value: ${{ jobs.check.outputs.completed }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      completed: ${{ steps.client-checks.outputs.completed }}
    env:
      BW_CLIENTS_COMMIT: b449ac1d255784380d75ef026343198891286be7
      BW_SDK_COMMIT: c5e53d3e82ab80fdc9fd79ebd74058399a6444b6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: npm ci --prefix tools
      - run: curl --fail --location --retry 3 "https://raw.githubusercontent.com/bitwarden/clients/$BW_CLIENTS_COMMIT/package-lock.json" -o "$RUNNER_TEMP/clients-build-package-lock.json"
      - name: Fetch the pinned bundled SDK request sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://codeload.github.com/bitwarden/sdk-internal/tar.gz/$BW_SDK_COMMIT" -o "$RUNNER_TEMP/sdk.tar.gz"
          mkdir -p "$RUNNER_TEMP/sdk-source"
          tar --extract --gzip --file "$RUNNER_TEMP/sdk.tar.gz" --directory "$RUNNER_TEMP/sdk-source" --strip-components=1
      - run: prlimit --version
      - run: cargo build --profile conformance -p no-warden-server -p no-warden-conformance --locked
      - name: Real client and authorization checks
        id: client-checks
        shell: bash
        env:
          CLIENT_SHARD: ${{ inputs.shard }}
          NO_WARDEN_BIN: ${{ github.workspace }}/target/conformance/no-warden-server
          NO_WARDEN_CONFORMANCE_PROFILE: conformance
          BW_CLIENTS_BUILD_LOCK: ${{ runner.temp }}/clients-build-package-lock.json
          BW_SDK_SOURCE_ROOT: ${{ runner.temp }}/sdk-source
        run: |
          set -euo pipefail
          NO_WARDEN_DB="$RUNNER_TEMP/no-warden.db" target/conformance/no-warden-server > "$RUNNER_TEMP/no-warden.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            kill -0 "$server_pid"
            if grep -Fq 'no-warden conformance server listening on 127.0.0.1:8000;' "$RUNNER_TEMP/no-warden.log" && curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 0.1
          done
          kill -0 "$server_pid"
          grep -Fq 'no-warden conformance server listening on 127.0.0.1:8000;' "$RUNNER_TEMP/no-warden.log"
          curl -fsS http://127.0.0.1:8000/health
          node tools/client-ci.mjs run "$CLIENT_SHARD"
          printf 'completed=true\n' >> "$GITHUB_OUTPUT"
